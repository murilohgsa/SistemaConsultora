<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isabela Andrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,700;0,900;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">

</head>
<body>

  <header>
    <div class="logo">Isabela Andrade</div>
    <nav>
      <a href="#">Meus Trabalhos</a>
      <a href="#">Sobre mim</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <svg class="hero-wave" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#ffffff" stroke-width="1">
        <path d="M60 0 C 180 100, 20 200, 160 300 C 300 400, 40 500, 200 600 C 320 680, 100 750, 180 800" />
        <path d="M100 0 C 220 90, 60 210, 190 310 C 320 410, 80 520, 230 610 C 340 690, 140 760, 210 800" />
        <path d="M140 0 C 260 80, 100 220, 220 320 C 340 420, 120 530, 260 620 C 360 700, 180 770, 240 800" />
        <path d="M180 0 C 300 70, 140 230, 250 330 C 360 430, 160 540, 290 630 C 380 710, 220 780, 270 800" />
      </svg>
      <h1>Consultoria<br>de<br>Moda</h1>
    </section>

    <section class="login">
      <div class="caixaLogin">
        <div class="campoLogin">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com">
        </div>

        <div class="campoLogin">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="••••••••">
        </div>

        <div class="recuperarSenha">
          <a href="#" class="esqueciSenha">Esqueci minha senha</a>
        </div>
        <div class="divBotao">
          <button class="btnEntrar" type="button">Entrar</button>
        </div>
      </div>
    </section>
  </main>

</body>
<script src="script.js"></script>
</html>
