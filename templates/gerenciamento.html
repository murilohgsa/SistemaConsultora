<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isabela Andrade — Gerenciamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,700;0,900;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/gerenciamento.css">
</head>
<body>

  <!-- barra superior: identidade + controles da administradora -->
  <header class="barraTopo">
    <div class="marcaTopo">Isabela Andrade</div>
    <div class="controlesTopo">
      <a class="linkFinanceiro" href="#">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2.5 3-2.5s3 .9 3 2.2c0 3-6 1.6-6 4.5 0 1.3 1.3 2.3 3 2.3s3-1 3-2.3"/></svg>
        Gerenciamento Financeiro
      </a>
      <div class="controleVisao">
        <span class="rotuloVisao">Visão administrador</span>
        <label class="alternador">
          <input type="checkbox" checked aria-label="Alternar visão administrador">
          <span class="trilhaAlternador"></span>
        </label>
      </div>
      <button class="botaoIcone" type="button" aria-label="Buscar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="botaoIcone botaoNotificacao" type="button" aria-label="Notificações, 1 nova">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z"/><path d="M10 18.5a2 2 0 0 0 4 0"/></svg>
        <span class="contadorNotificacao" aria-hidden="true">1</span>
      </button>
    </div>
  </header>

  <main class="mainGerenciamento">

    <!-- lista de clientes -->
    <aside class="listaClientes" aria-label="Lista de clientes">
      <div class="cabecalhoClientes">
        <div class="tituloClientes">
          <svg viewBox="0 0 24 24"><path d="M8 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M2.5 20c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><path d="M18 8v5M15.5 10.5h5"/></svg>
          <h2>Clientes</h2>
        </div>
        <button class="botaoIcone" type="button" aria-label="Buscar cliente">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>

      <ul class="scrollClientes" role="list">
        <li>
          <button class="itemCliente" type="button" aria-current="true">
            <img src="https://i.pravatar.cc/72?img=12" alt="">
            Cliente 1
          </button>
        </li>
        <li>
          <button class="itemCliente" type="button">
            <img src="https://i.pravatar.cc/72?img=32" alt="">
            Cliente 2
          </button>
        </li>
        <li>
          <button class="itemCliente" type="button">
            <img src="https://i.pravatar.cc/72?img=5" alt="">
            Cliente 3
          </button>
        </li>
        <li>
          <button class="itemCliente" type="button">
            <img src="https://i.pravatar.cc/72?img=51" alt="">
            Cliente 4
          </button>
        </li>
        <li>
          <button class="itemCliente" type="button">
            <img src="https://i.pravatar.cc/72?img=47" alt="">
            Cliente 5
          </button>
        </li>
        <li>
          <button class="itemCliente" type="button">
            <img src="https://i.pravatar.cc/72?img=33" alt="">
            Cliente 6
          </button>
        </li>
        <li>
          <button class="itemCliente" type="button">
            <img src="https://i.pravatar.cc/72?img=14" alt="">
            Cliente 7
          </button>
        </li>
        <li>
          <button class="itemCliente" type="button">
            <img src="https://i.pravatar.cc/72?img=25" alt="">
            Cliente 8
          </button>
        </li>
        <li>
          <button class="itemCliente" type="button">
            <img src="https://i.pravatar.cc/72?img=44" alt="">
            Cliente 9
          </button>
        </li>
      </ul>
    </aside>

    <!-- detalhe do cliente selecionado -->
    <section class="conteudoCliente" aria-labelledby="nomeClienteAtivo">
      <div class="cabecalhoCliente">
        <img src="https://i.pravatar.cc/76?img=12" alt="">
        <h1 id="nomeClienteAtivo">Cliente 1</h1>
      </div>

      <nav class="abasCliente" role="tablist" aria-label="Seções do cliente">
        <button class="abaCliente" type="button" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Gráficos
        </button>
        <button class="abaCliente" type="button" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7Z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>
          Peças
        </button>
        <button class="abaCliente" type="button" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>
          Relatório
        </button>
        <button class="abaCliente" type="button" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="13" rx="1.5"/><path d="M3.5 14.5 8 10l3 3 4-4.5 5.5 5.5"/></svg>
          Plano de Imagem
        </button>
        <button class="abaCliente" type="button" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M12 4l-3.5 3.5M12 4l3.5 3.5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
          Adicionar Looks
        </button>
      </nav>

      <div class="painelGraficos" role="tabpanel">

        <article class="cartaoGrafico tomLaranja">
          <h3>Looks por estação</h3>
          <div class="espacoGrafico">
            <div class="avisoGrafico">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 12 12 5"/><path d="M12 12l5.5 3.2"/></svg>
              <span>Gráfico em breve</span>
            </div>
          </div>
        </article>

        <article class="cartaoGrafico tomAzul">
          <h3>Looks por categoria</h3>
          <div class="espacoGrafico">
            <div class="avisoGrafico">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 12 12 5"/><path d="M12 12l5.5 3.2"/></svg>
              <span>Gráfico em breve</span>
            </div>
          </div>
        </article>

        <article class="cartaoGrafico tomLaranja">
          <h3>Looks favoritos</h3>
          <div class="carrosselFavoritos">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=300&auto=format&fit=crop" alt="Look favorito 1">
            <img src="https://images.unsplash.com/photo-1490114538077-0a7f8cb49891?q=80&w=300&auto=format&fit=crop" alt="Look favorito 2">
            <img src="https://images.unsplash.com/photo-1520975954732-35dd22299614?q=80&w=300&auto=format&fit=crop" alt="Look favorito 3">
            <img src="https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?q=80&w=300&auto=format&fit=crop" alt="Look favorito 4">
            <button class="setaCarrossel" type="button" aria-label="Ver próximos looks favoritos" onclick="this.previousElementSibling.scrollIntoView({behavior:'smooth', inline:'center'})">
              <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </article>

        <article class="cartaoGrafico tomRosa">
          <h3>Looks favoritos por categoria</h3>
          <div class="espacoGrafico">
            <div class="avisoGrafico">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 12 12 5"/><path d="M12 12l5.5 3.2"/></svg>
              <span>Gráfico em breve</span>
            </div>
          </div>
        </article>

      </div>
    </section>

  </main>

</body>
<script src="script.js"></script>
</html>
