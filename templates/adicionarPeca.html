<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adicionar peça</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/adicionarPeca.css">
</head>
<body>

  <header class="barraCliente">
    <div class="identidadeCliente">
      <a href="{{ url_for('feed') }}" class="voltarCliente" aria-label="Voltar para o feed">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </a>
      <span class="nomeCliente">Isabela Andrade</span>
    </div>

    <button class="botaoNotificacaoCliente" type="button" aria-label="Notificações">
      <svg viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 01-3.4 0"/>
      </svg>
    </button>
  </header>

  <main class="paginaAdicionar">
    <h1 class="tituloPagina">Adicionar peça</h1>

    <form id="formAdicionarPecaCliente"
          class="formPeca"
          action="{{ url_for('adicionar_peca') }}"
          method="POST"
          enctype="multipart/form-data">
        <input type="hidden" name="id_cliente" value="{{ id_cliente }}">
      <!-- coluna esquerda -->

        <div class="campoPeca">
          <span class="rotuloCampo">Imagem</span>
          <label class="botaoImagem" for="imagemPeca">
            <span class="iconeImagem">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="9" cy="9" r="1.6"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
            </span>
            <span class="textoImagem" id="textoImagem">Escolher imagem</span>
          </label>
          <input class="inputImagem" type="file" id="imagemPeca" name="imagem" accept="image/*" required>
        </div>

        <div class="campoPeca">
          <label class="rotuloCampo" for="tituloPeca">Título</label>
          <input class="inputTexto" type="text" id="tituloPeca" name="titulo"
                 placeholder="Ex: Calça preta alfaiataria" required>
        </div>

        <div class="campoPeca">
          <label class="rotuloCampo" for="categoriaPeca">Categoria</label>
          <div class="selectWrapper">
            <select class="selectCategoria" id="categoriaPeca" name="id_categoria" required>
                <option value="">Selecione...</option>
                {% for cat in categorias %}
                    <option value="{{ cat.id_categoria }}">{{ cat.nome }}</option>
                {% endfor %}
            </select>
          </div>
        </div>

        <fieldset class="campoPeca">
          <legend class="rotuloCampo">Estação</legend>
          <div class="grupoRadio">
            <label class="opcaoRadio"><input type="radio" name="estacao" value="verao" required><span>Verão</span></label>
            <label class="opcaoRadio"><input type="radio" name="estacao" value="inverno"><span>Inverno</span></label>
            <label class="opcaoRadio"><input type="radio" name="estacao" value="primavera"><span>Primavera</span></label>
            <label class="opcaoRadio"><input type="radio" name="estacao" value="outono"><span>Outono</span></label>
          </div>
        </fieldset>

        <fieldset class="campoPeca">
          <legend class="rotuloCampo">Ocasião</legend>
          <div class="grupoRadio">
            <label class="opcaoRadio"><input type="radio" name="ocasiao" value="trabalho" required><span>Trabalho</span></label>
            <label class="opcaoRadio"><input type="radio" name="ocasiao" value="festa"><span>Festa</span></label>
            <label class="opcaoRadio"><input type="radio" name="ocasiao" value="jantar"><span>Jantar</span></label>
            <label class="opcaoRadio"><input type="radio" name="ocasiao" value="faculdade"><span>Faculdade</span></label>
            <label class="opcaoRadio"><input type="radio" name="ocasiao" value="casual"><span>Casual</span></label>
          </div>
        </fieldset>

      </div>

      <!-- coluna direita -->
      <div class="colunaObservacoes">
        <label class="rotuloCampo" for="observacoesPeca">Observações</label>
        <textarea class="caixaObservacoes" id="observacoesPeca" name="observacoes"
                  placeholder="Adicionar observações..."></textarea>

        <button class="botaoEnviar" type="submit" aria-label="Adicionar peça">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>

    </form>
  </main>

</body>
<script src="/static/adicionarPeca.js"></script>
</html>
