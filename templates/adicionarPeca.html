<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isabela Andrade — Adicionar peça</title>
  <!--
    [NOVO VISUAL] Igual à janela "Nova peça" da consultora, como o
    "Criar nova publicação" do Instagram: foto grande à esquerda e os
    campos à direita. Mesmas cores e fontes originais.
    Estilos: tema.css + gerenciamento.css (formulário) + cliente.css.
    Lógica (pré-visualização da foto e validação): static/adicionarPeca.js
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,700;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tema.css">
  <link rel="stylesheet" href="/static/gerenciamento.css">
  <link rel="stylesheet" href="/static/notificacoes.css">
  <link rel="stylesheet" href="/static/cliente.css">
</head>
<body>

  <header class="barraTopo">
    <div class="conteudoBarra">
      <a href="{{ url_for('feed') }}" class="botaoIcone voltarTopo" aria-label="Voltar para o feed">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </a>
      <span class="logo">Isabela Andrade</span>
      <div class="acoesTopo">
        <!-- sininho: o número e a lista vêm de /notificacoes (static/notificacoes.js) -->
        <div class="areaNotificacoes">
          <button class="botaoIcone botaoNotificacao" id="btnNotificacoes" type="button"
                  aria-label="Notificações" aria-expanded="false" aria-controls="painelNotificacoes">
            <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z"/><path d="M10 18.5a2 2 0 0 0 4 0"/></svg>
            <span class="contadorNotificacao" id="contadorNotificacoes" aria-hidden="true" hidden></span>
          </button>
          <div class="painelNotificacoes" id="painelNotificacoes" role="dialog" aria-label="Notificações">
            <p class="tituloNotificacoes">Notificações</p>
            <ul class="listaNotificacoes" id="listaNotificacoes"></ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="paginaSimples" style="max-width: 900px">
    <div class="cartaoNovaPeca">
      <h1 class="cabecalhoModal">Nova peça</h1>

      <!-- [NOVO] mensagens do Flask (antes a cliente não via se deu certo ou errado) -->
      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, msg in mensagens %}
          <p class="msgRetorno {{ categoria }} msgModal">{{ msg }}</p>
        {% endfor %}
      {% endwith %}

      <form id="formAdicionarPecaCliente" class="formPeca"
            action="{{ url_for('adicionar_peca') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="id_cliente" value="{{ id_cliente }}">

        <!-- área da foto: clicar ou arrastar a imagem; mostra a prévia -->
        <label class="areaFoto" id="areaFoto">
          <input type="file" id="imagemPeca" name="imagem" accept="image/*" required>
          <img id="previaFoto" alt="" hidden>
          <span class="textoAreaFoto" id="textoAreaFoto">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>Arraste a foto da peça aqui</span>
            <span class="botao botaoDestaque">Selecionar foto</span>
          </span>
        </label>

        <div class="colunaCampos">
          <input class="campo" type="text" id="tituloPeca" name="titulo" placeholder="Título (ex.: Calça preta alfaiataria)"
                 aria-label="Título" maxlength="100" required>
          <select class="campo" id="categoriaPeca" name="id_categoria" aria-label="Categoria" required>
            <option value="" disabled selected>Categoria</option>
            {% for cat in categorias %}
              <option value="{{ cat.id_categoria }}">{{ cat.nome }}</option>
            {% endfor %}
          </select>

          <!-- [REVISÃO] os valores eram minúsculos e sem acento ("verao"), mas a
               consultora cadastra "Verão". Com valores diferentes o filtro de
               estação não encontrava as peças cadastradas pela cliente. -->
          <fieldset class="grupoCampo">
            <legend class="rotuloSecao">Estação</legend>
            <div class="grupoRadio">
              <label class="opcaoRadio"><input type="radio" name="estacao" value="Verão" required><span>Verão</span></label>
              <label class="opcaoRadio"><input type="radio" name="estacao" value="Outono"><span>Outono</span></label>
              <label class="opcaoRadio"><input type="radio" name="estacao" value="Inverno"><span>Inverno</span></label>
              <label class="opcaoRadio"><input type="radio" name="estacao" value="Primavera"><span>Primavera</span></label>
            </div>
          </fieldset>
          <fieldset class="grupoCampo">
            <legend class="rotuloSecao">Ocasião</legend>
            <div class="grupoRadio">
              <label class="opcaoRadio"><input type="radio" name="ocasiao" value="Trabalho" required><span>Trabalho</span></label>
              <label class="opcaoRadio"><input type="radio" name="ocasiao" value="Festa"><span>Festa</span></label>
              <label class="opcaoRadio"><input type="radio" name="ocasiao" value="Jantar"><span>Jantar</span></label>
              <label class="opcaoRadio"><input type="radio" name="ocasiao" value="Faculdade"><span>Faculdade</span></label>
              <label class="opcaoRadio"><input type="radio" name="ocasiao" value="Casual"><span>Casual</span></label>
            </div>
          </fieldset>
          <textarea class="campo" id="observacoesPeca" name="observacoes" rows="3"
                    placeholder="Observações (tecido, caimento, com o que combina...)" aria-label="Observações"></textarea>
          <p class="msgRetorno erro" id="msgPeca" hidden></p>
          <button class="botao botaoPrimario botaoLargo botaoEnviar" type="submit">Adicionar ao guarda-roupa</button>
        </div>
      </form>
    </div>
  </main>

  <div class="avisoNovoLook" id="avisoNovoLook" role="status" hidden></div>

</body>
<script src="/static/adicionarPeca.js"></script>
<script src="/static/notificacoes.js"></script>
</html>
